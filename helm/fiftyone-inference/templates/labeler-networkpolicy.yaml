{{- if include "inference.labeler.enabled" . }}
# The labeler checks the shared token, then trusts the organization its
# callers name. Only pods in this namespace may call it as well
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "inference.name" . }}-labeler
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "inference.chartLabels" . | nindent 4 }}
    {{- include "inference.labeler.selectorLabels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "inference.labeler.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
      ports:
        - port: 8080
{{- end }}
