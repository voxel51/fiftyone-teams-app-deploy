{{- if not .Values.sharedToken.secretName }}
{{- $token := required "sharedToken.secretName or sharedToken.value is required" .Values.sharedToken.value | trim }}
{{- if lt (len $token) 32 }}
{{- fail "sharedToken.value must be at least 32 characters: the inference service refuses a shorter one" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "inference.tokenSecret" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "inference.chartLabels" . | nindent 4 }}
    {{- include "inference.selectorLabels" . | nindent 4 }}
type: Opaque
stringData:
  token: {{ $token | quote }}
{{- end }}
