{{- if include "inference.labeler.enabled" . }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "inference.name" . }}-labeler
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "inference.chartLabels" . | nindent 4 }}
    {{- include "inference.labeler.selectorLabels" . | nindent 4 }}
spec:
  selector:
    {{- include "inference.labeler.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
{{- end }}
