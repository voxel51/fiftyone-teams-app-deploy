{{- if .Values.mcpGatewaySettings.enabled }}
apiVersion: v1
kind: Service
metadata:
  {{- with .Values.mcpGatewaySettings.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  name: {{ include "mcp-gateway.name" . }}
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "mcp-gateway.labels" . | nindent 4 }}
    {{- with .Values.mcpGatewaySettings.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  type: {{ .Values.mcpGatewaySettings.service.type }}
  ports:
    - port: {{ .Values.mcpGatewaySettings.service.port }}
      targetPort: {{ .Values.mcpGatewaySettings.service.shortname }}
      protocol: TCP
      name: http
  selector:
    {{- include "mcp-gateway.selectorLabels" . | nindent 4 }}
{{- end }}
