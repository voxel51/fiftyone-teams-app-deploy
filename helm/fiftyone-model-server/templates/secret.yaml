{{- if and .Values.token.value (not .Values.token.secretName) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "model-server.tokenSecret" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "model-server.labels" . | nindent 4 }}
type: Opaque
stringData:
  token: {{ .Values.token.value | quote }}
{{- end }}
