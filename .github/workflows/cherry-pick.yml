name: Cherry-Pick to Release

# Opens a PR that cherry-picks a merged main PR to a release branch.
# It cherry-picks the PR's merge commit with `-x`,
# so the Release Gate can confirm the commit is on main.
#
# Start it in one of two ways:
#
# - Manually trigger it with a PR number and a release branch.
# - Label a main PR 'cherry-pick-to-release'.
#   When the PR merges,
#   this workflow opens the release-branch PR.
#
# If the cherry-pick conflicts,
# the run fails and comments on the source PR.
# A person must resolve the conflict.
# A conflict often means the fix needs the 'release-only-fix' label instead.
#
# Runs as voxel51-bot (FIFTYONE_GITHUB_TOKEN)
# so the PRs it opens start CI.
# PRs opened with the default Actions token don't start CI.

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Merged main PR number to cherry-pick"
        required: true
      release_branch:
        description: "Target release branch, e.g. release/v2.26.0"
        required: true
  # PRs come from branches in this repo,
  # so the pull_request trigger is enough.
  # For a PR from a fork, run the workflow by hand.
  pull_request:
    types: [closed, labeled]
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  cherry-pick-to-release-branch:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
       contains(github.event.pull_request.labels.*.name, 'cherry-pick-to-release'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Blobless clone.
          # The cherry-pick needs the full commit history
          # to find a merge commit's parents.
          # It only needs the contents of the files it changes.
          fetch-depth: 0
          filter: blob:none
          token: ${{ secrets.FIFTYONE_GITHUB_TOKEN }}
      - name: Cherry-pick and open PR
        env:
          GH_TOKEN: ${{ secrets.FIFTYONE_GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr_number || github.event.pull_request.number }}
          RELEASE_BRANCH: ${{ inputs.release_branch || '' }}
        run: |
          set -euo pipefail

          # Only one release branch is active at a time.
          # The label flow targets the newest one.
          if [ -z "$RELEASE_BRANCH" ]; then
            RELEASE_BRANCH=$(gh api "repos/$REPO/branches" --paginate \
              --jq '.[].name | select(startswith("release/v"))' | sort -V | tail -1)
          fi
          if [[ "$RELEASE_BRANCH" != release/v* ]]; then
            echo "::error::No release/v* branch to target (got '${RELEASE_BRANCH:-none}')."
            exit 1
          fi

          fields=$(gh pr view "$PR_NUMBER" --json state,baseRefName,mergeCommit,title \
            --jq '[.state, .baseRefName, .mergeCommit.oid, .title] | @tsv')
          IFS=$'\t' read -r state base sha title <<< "$fields"

          if [ "$state" != "MERGED" ] || [ "$base" != "main" ]; then
            echo "::error::PR #$PR_NUMBER must be a merged main PR (state=$state, base=$base)."
            exit 1
          fi

          git fetch --quiet origin main "$RELEASE_BRANCH"
          git config user.name "voxel51-bot"
          git config user.email "voxel51-bot@users.noreply.github.com"

          branch="cherry-pick/${RELEASE_BRANCH#release/}/pr-$PR_NUMBER"
          git checkout -b "$branch" "origin/$RELEASE_BRANCH"

          mainline=()
          if [ "$(git rev-list --parents -n 1 "$sha" | wc -w)" -gt 2 ]; then
            mainline=(-m 1)
          fi
          if ! git cherry-pick -x "${mainline[@]}" "$sha"; then
            git cherry-pick --abort
            gh pr comment "$PR_NUMBER" --body "Cherry-pick to \`$RELEASE_BRANCH\` conflicts — pick it manually with \`git cherry-pick -x\`, or use the \`release-only-fix\` escape hatch if main has moved on."
            echo "::error::Cherry-pick of $sha onto $RELEASE_BRANCH conflicts."
            exit 1
          fi

          git push origin "$branch"
          gh pr create \
            --base "$RELEASE_BRANCH" \
            --head "$branch" \
            --title "[$RELEASE_BRANCH] $title" \
            --body "Cherry-pick of #$PR_NUMBER."
