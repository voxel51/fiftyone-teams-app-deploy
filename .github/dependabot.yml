---
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      # Every other Tuesday at 9 AM UTC (5 AM EDT, 4 AM EST).
      # tue%2 is fugit's modulo extension, which Dependabot supports.
      interval: "cron"
      cronjob: "0 9 * * tue%2"
    cooldown:
      default-days: 7
