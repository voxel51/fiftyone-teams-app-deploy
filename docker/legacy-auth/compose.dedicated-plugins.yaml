---
# For Proxy Server instructions please see
#  https://github.com/voxel51/fiftyone-teams-app-deploy/tree/main/docker#environment-proxies
services:
  fiftyone-app:
    extends:
      file: ../common-services.yaml
      service: fiftyone-app-common

  teams-api:
    environment:
      FIFTYONE_PLUGINS_DIR: /opt/plugins
    extends:
      file: ../common-services.yaml
      service: teams-api-common
    volumes:
      - plugins-vol:/opt/plugins

  teams-app:
    environment:
      FIFTYONE_TEAMS_PLUGIN_URL: ${FIFTYONE_TEAMS_PLUGIN_URL}
    extends:
      file: ../common-services.yaml
      service: teams-app-common

  teams-cas:
    environment:
      CAS_URL: ${AUTH0_BASE_URL}
      NEXTAUTH_URL: ${AUTH0_BASE_URL}/cas/api/auth
    extends:
      file: ../common-services.yaml
      service: teams-cas-common

  teams-plugins:
    extends:
      file: ../common-services.yaml
      service: teams-plugins-common
    volumes:
      - plugins-vol:/opt/plugins:ro

  # Activity Analytics: the fiftyone.mq queue Redis and the worker that drains
  # it into the activity_* collections. See
  # docker/docs/configuring-activity-analytics.md.
  # Using an external Redis? Point FIFTYONE_MQ_REDIS_URL at it in .env and
  # remove this service in compose.override.yaml.
  fiftyone-mq-redis:
    extends:
      file: ../common-services.yaml
      service: fiftyone-mq-redis-common

  activity-worker:
    depends_on:
      - fiftyone-mq-redis
    extends:
      file: ../common-services.yaml
      service: activity-worker-common

  telemetry-redis:
    extends:
      file: ../common-services.yaml
      service: telemetry-redis-common

  fiftyone-app-telemetry:
    extends:
      file: ../common-services.yaml
      service: fiftyone-app-telemetry-common
    depends_on:
      fiftyone-app:
        condition: service_started
        restart: true
      telemetry-redis:
        condition: service_started

  teams-api-telemetry:
    extends:
      file: ../common-services.yaml
      service: teams-api-telemetry-common
    depends_on:
      teams-api:
        condition: service_started
        restart: true
      telemetry-redis:
        condition: service_started

  teams-plugins-telemetry:
    extends:
      file: ../common-services.yaml
      service: teams-plugins-telemetry-common
    depends_on:
      teams-plugins:
        condition: service_started
        restart: true
      telemetry-redis:
        condition: service_started

volumes:
  fiftyone-mq-redis-data:
  plugins-vol:
  telemetry-redis-data:
