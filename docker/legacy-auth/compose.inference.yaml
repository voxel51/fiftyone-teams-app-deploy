---
# FiftyOne inference service: FiftyOne Enterprise sends it embeddings,
# predictions, segmentation and LLM calls, and it routes them to the model
# server at MODEL_SERVER_URL (compose.model-server.yaml) or to your LLM
# endpoint. See the Inference Service section of docker/README.md.
#
# Activate by adding this file to your usual `-f` set, for example with the
# model server on the same worker:
#
#   docker compose \
#     -f compose.dedicated-plugins.yaml \
#     -f compose.delegated-operators.yaml \
#     -f compose.model-server.yaml \
#     -f compose.inference.yaml \
#     -f compose.override.yaml \
#     up -d
#
# With an LLM backend, also run the shared agentic labeler: set
# `COMPOSE_PROFILES=labeler` in .env, or add `--profile labeler`.
services:
  inference:
    image: voxel51/inference:v2.25.1
    environment:
      # Every caller sends this token. At least 32 characters, or the service
      # refuses to start.
      AUTH_MODE: shared-token
      AUTH_SHARED_TOKEN: ${INFERENCE_SHARED_TOKEN:?INFERENCE_SHARED_TOKEN is required}
      # Each call is admitted against the license of the org it names: list
      # one file per org, comma separated, in LICENSE_KEY_FILE_PATHS
      BILLING_MODE: license
      LICENSE_KEY_FILE_PATHS: ${LICENSE_KEY_FILE_PATHS:-/opt/fiftyone/licenses/license}
      MAX_BODY_BYTES: ${INFERENCE_MAX_BODY_BYTES:-67108864}
      # The model servers' bearer token, the same as theirs. Empty: none
      MODEL_SERVER_TOKEN: ${MODEL_SERVER_TOKEN:-}
      PORT: 8080
      STORE_MODE: memory
      # The model server, with every model its image serves, the same list
      # the Helm chart ships (helm/fiftyone-inference/catalog). The default
      # URL is compose.model-server.yaml on this worker. To add an LLM, set
      # BACKENDS in compose.override.yaml.
      BACKENDS: |
        - kind: model-server
          id: model-server
          # A bearer token when MODEL_SERVER_TOKEN is set, else none
          auth: ${MODEL_SERVER_TOKEN:+{mode: bearer-token, tokenEnv: MODEL_SERVER_TOKEN}}
          baseUrl: ${MODEL_SERVER_URL:-http://model-server:8080}
          models:
            - name: qwen3-vl-embedding-2b-torch
              architecture: Qwen3-VL
              description: Multimodal encoder for video. Embeds a clip and a text query
                into one space, so a search box can find a moment.
              dimensions: 2048
              intervalSec: 5
              license: Apache-2.0
              # One video per request, but images batch like SigLIP
              maxImagesPerEmbed: 32
              maxMediaPerRequest: 1
              maxSegmentSec: 60
              # The most one whole video embed reads: 768 frames at 2 a second
              maxWholeSec: 384
              modality: video
              supportsLogits: false
              supportsText: true
              tags: [embeddings, video]
              tasks: [embedding]
            - name: segment-anything-2-hiera-large-image-torch
              architecture: SAM 2
              description: Click to segment. Takes point prompts and answers with one mask.
              license: Apache-2.0
              maxMediaPerRequest: 1
              supportsLogits: false
              supportsText: false
              tags: [segmentation, interactive]
              tasks: [prediction]
            - name: segment-anything-2-hiera-large-video-torch
              architecture: SAM 2
              description: Follows a mask through a clip.
              license: Apache-2.0
              maxMediaPerRequest: 1
              modality: video
              supportsLogits: false
              supportsText: false
              tags: [segmentation, interactive, video]
              tasks: [propagation]
            - name: siglip-base-patch16-224-torch
              architecture: SigLIP 2 ViT-B/16
              description: Contrastive image and text encoder.
              dimensions: 768
              license: Apache-2.0
              maxMediaPerRequest: 32
              modelKwargs: [classes, text_prompt]
              parameters: 375187970
              supportsLogits: true
              supportsText: true
              tags: [classification, zero-shot, embeddings]
              tasks: [embedding, prediction]
    # Sized with the service: its 320 s drain of the calls in flight and the
    # rest of its shutdown
    stop_grace_period: 360s
    restart: always
    volumes:
      - type: bind
        source: ${LOCAL_LICENSE_FILE_DIR}
        target: /opt/fiftyone/licenses
        read_only: true

  # Checks the shared token, then trusts the organization its callers name.
  # Only containers of this project reach it
  inference-labeler:
    image: voxel51/agentic-labeler-cpu:v2.25.1
    profiles: ["labeler"]
    environment:
      FIFTYONE_INFERENCE_TOKEN: ${INFERENCE_SHARED_TOKEN}
      FIFTYONE_INFERENCE_URL: http://inference:8080
      # Callers send the shared token, FIFTYONE_INFERENCE_TOKEN
      LABELER_AUTH_MODE: shared-token
      LABELER_CONFIG_FILE: /app/configs/remote-gpt-6-sol.json
      # Jobs at once. Each holds its images in memory, about 3.4 GiB at most.
      LABELER_MAX_IN_FLIGHT_TESTS: 1
      LABELER_SERVICE_MODE: shared
    # The 150 s drain of the jobs in flight and the rest of its shutdown
    stop_grace_period: 180s
    restart: always
