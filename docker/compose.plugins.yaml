---
# For Proxy Server instructions please see
#  https://github.com/voxel51/fiftyone-teams-app-deploy/tree/main/docker#globe_with_meridians-step-5-configure-ssl--reverse-proxy-nginx--load-balancer
# Plugins overlay: shares a plugins volume between fiftyone-app and teams-api.
# Stack it on compose.yaml.
# See docker/docs/configuring-plugins.md.
#
#   docker compose \
#     -f compose.yaml \
#     -f compose.plugins.yaml \
#     -f compose.override.yaml \
#     up -d
services:
  fiftyone-app:
    environment:
      FIFTYONE_PLUGINS_DIR: /opt/plugins
    volumes:
      - plugins-vol:/opt/plugins:ro

  teams-api:
    environment:
      FIFTYONE_PLUGINS_DIR: /opt/plugins
    volumes:
      - plugins-vol:/opt/plugins

volumes:
  plugins-vol:
