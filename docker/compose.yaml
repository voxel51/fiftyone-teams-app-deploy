---
# For Proxy Server instructions please see
#  https://github.com/voxel51/fiftyone-teams-app-deploy/tree/main/docker#globe_with_meridians-step-5-configure-ssl--reverse-proxy-nginx--load-balancer
name: voxel51
services:
  fiftyone-app:
    image: voxel51/fiftyone-app:v2.26.0
    environment:
      API_URL: ${API_URL}
      FIFTYONE_APP_DEFAULT_QUERY_PERFORMANCE: ${FIFTYONE_APP_DEFAULT_QUERY_PERFORMANCE}
      FIFTYONE_APP_ENABLE_QUERY_PERFORMANCE: ${FIFTYONE_APP_ENABLE_QUERY_PERFORMANCE}
      FIFTYONE_AUTH_SECRET: ${FIFTYONE_AUTH_SECRET}
      FIFTYONE_DATABASE_ADMIN: false
      FIFTYONE_DATABASE_NAME: ${FIFTYONE_DATABASE_NAME}
      FIFTYONE_DATABASE_URI: ${FIFTYONE_DATABASE_URI}
      FIFTYONE_DEFAULT_APP_ADDRESS: 0.0.0.0
      FIFTYONE_DEFAULT_APP_PORT: 5151
      FIFTYONE_ENCRYPTION_KEY: ${FIFTYONE_ENCRYPTION_KEY}
      FIFTYONE_INTERNAL_SERVICE: true
      FIFTYONE_MEDIA_CACHE_APP_IMAGES: false
      FIFTYONE_MEDIA_CACHE_SIZE_BYTES: -1
      FIFTYONE_SIGNED_URL_EXPIRATION: ${FIFTYONE_SIGNED_URL_EXPIRATION:-24}
      # Activity Analytics is on by default and this flag is the only gate.
      # The queue URL below says *where* to emit, never *whether*: it
      # carries a default, so "unset" and "explicitly local" look
      # identical and it cannot serve as the switch. Emit, flush, and
      # the operator mutation capture all no-op while this is false,
      # before any queue client is constructed.
      # Set FIFTYONE_ACTIVITY_ENABLED=false in .env to turn capture off.
      FIFTYONE_ACTIVITY_ENABLED: ${FIFTYONE_ACTIVITY_ENABLED:-true}
      # Activity Analytics: where operator/annotation emits enqueue events.
      # Emit is fire-and-forget; unset = those events simply don't flow.
      FIFTYONE_MQ_REDIS_URL: ${FIFTYONE_MQ_REDIS_URL:-redis://fiftyone-mq-redis:6379/0}
      FIFTYONE_ACTIVITY_ORG_ID: ${FIFTYONE_ACTIVITY_ORG_ID}
      FIFTYONE_TELEMETRY_REDIS_URL: ${FIFTYONE_TELEMETRY_REDIS_URL:-redis://telemetry-redis:6379}
      # If you are routing through a proxy server you will want to set
      #  HTTP_PROXY_URL, HTTPS_PROXY_URL, and NO_PROXY_LIST in your .env
      #  then add the following environment variables to your
      #  `compose.override.yaml`
      # HTTPS_PROXY: ${HTTPS_PROXY_URL}
      # HTTP_PROXY: ${HTTP_PROXY_URL}
      # NO_PROXY: ${NO_PROXY_LIST}
      # http_proxy: ${HTTP_PROXY_URL}
      # https_proxy: ${HTTPS_PROXY_URL}
      # no_proxy: ${NO_PROXY_LIST}
    ports:
      - ${FIFTYONE_DEFAULT_APP_ADDRESS}:${FIFTYONE_DEFAULT_APP_PORT}:5151
    restart: always

  teams-api:
    image: voxel51/fiftyone-teams-api:v2.26.0
    environment:
      API_EXTERNAL_URL: ${FIFTYONE_API_URI}
      CAS_BASE_URL: ${CAS_BASE_URL:-http://teams-cas:3000/cas/api}
      FIFTYONE_AUTH_SECRET: ${FIFTYONE_AUTH_SECRET}
      FIFTYONE_BUILTIN_SERVICES_PATH: /opt/builtin-services/builtin_services.yaml
      FIFTYONE_DATABASE_NAME: ${FIFTYONE_DATABASE_NAME}
      FIFTYONE_DATABASE_URI: ${FIFTYONE_DATABASE_URI}
      FIFTYONE_ENCRYPTION_KEY: ${FIFTYONE_ENCRYPTION_KEY}
      FIFTYONE_ENV: ${FIFTYONE_ENV}
      FIFTYONE_INTERNAL_SERVICE: true
      FIFTYONE_LOGGING_FORMAT: ${FIFTYONE_LOGGING_FORMAT:-text}
      # Activity Analytics is on by default and this flag is the only gate.
      # The queue URL below says *where* to emit, never *whether*: it
      # carries a default, so "unset" and "explicitly local" look
      # identical and it cannot serve as the switch. Emit, flush, and
      # the operator mutation capture all no-op while this is false,
      # before any queue client is constructed.
      # Set FIFTYONE_ACTIVITY_ENABLED=false in .env to turn capture off.
      FIFTYONE_ACTIVITY_ENABLED: ${FIFTYONE_ACTIVITY_ENABLED:-true}
      # Activity Analytics: teams-api hosts the domain-event bridge, which
      # enqueues activity events here. Unset = bridged events are dropped.
      FIFTYONE_MQ_REDIS_URL: ${FIFTYONE_MQ_REDIS_URL:-redis://fiftyone-mq-redis:6379/0}
      FIFTYONE_ACTIVITY_ORG_ID: ${FIFTYONE_ACTIVITY_ORG_ID}
      # Deployment-level Events archiving (Settings > Events). Empty values
      # leave the API's defaults; FIFTYONE_ACTIVITY_MAX_STORAGE_BYTES is the
      # same budget the activity prune worker caps at.
      FIFTYONE_ACTIVITY_ARCHIVE_RETENTION_MODE: ${FIFTYONE_ACTIVITY_ARCHIVE_RETENTION_MODE:-}
      FIFTYONE_ACTIVITY_ARCHIVE_BUCKET_PATH: ${FIFTYONE_ACTIVITY_ARCHIVE_BUCKET_PATH:-}
      FIFTYONE_ACTIVITY_ARCHIVE_TRIGGER: ${FIFTYONE_ACTIVITY_ARCHIVE_TRIGGER:-}
      FIFTYONE_ACTIVITY_ARCHIVE_AFTER_DAYS: ${FIFTYONE_ACTIVITY_ARCHIVE_AFTER_DAYS:-}
      FIFTYONE_ACTIVITY_ARCHIVE_SETTINGS_LOCKED: ${FIFTYONE_ACTIVITY_ARCHIVE_SETTINGS_LOCKED:-false}
      FIFTYONE_ACTIVITY_MAX_STORAGE_BYTES: ${FIFTYONE_ACTIVITY_MAX_STORAGE_BYTES:-10737418240}
      FIFTYONE_SERVICE_POD_READY_TIMEOUT_S: ${FIFTYONE_SERVICE_POD_READY_TIMEOUT_S:-1800}
      FIFTYONE_TELEMETRY_REDIS_URL: ${FIFTYONE_TELEMETRY_REDIS_URL:-redis://telemetry-redis:6379}
      GRAPHQL_DEFAULT_LIMIT: ${GRAPHQL_DEFAULT_LIMIT}
      LOGGING_LEVEL: ${API_LOGGING_LEVEL:-INFO}
      MONGO_DEFAULT_DB: ${FIFTYONE_DATABASE_NAME}
      # If you are routing through a proxy server you will want to set
      #  HTTP_PROXY_URL, HTTPS_PROXY_URL, and NO_PROXY_LIST in your .env
      #  then add the following environment variables to your
      #  `compose.override.yaml`
      # HTTPS_PROXY: ${HTTPS_PROXY_URL}
      # HTTP_PROXY: ${HTTP_PROXY_URL}
      # NO_PROXY: ${NO_PROXY_LIST}
      # http_proxy: ${HTTP_PROXY_URL}
      # https_proxy: ${HTTPS_PROXY_URL}
      # no_proxy: ${NO_PROXY_LIST}
    ports:
      - ${API_BIND_ADDRESS}:${API_BIND_PORT}:8000
    restart: always
    # Builtin services list, reconciled at startup so the services show up in
    # Settings -> Services (created stopped). Source is builtin_services.yaml in
    # this file's directory (docker/). Edit it to add, remove, or retarget
    # services. See docs/configuring-service-orchestrator.md.
    volumes:
      - type: bind
        source: ./builtin_services.yaml
        target: /opt/builtin-services/builtin_services.yaml
        read_only: true

  teams-app:
    image: voxel51/fiftyone-teams-app:v2.26.0
    environment:
      API_URL: ${API_URL}
      APP_USE_HTTPS: ${APP_USE_HTTPS:-true}
      FIFTYONE_API_URI: ${FIFTYONE_API_URI:-"Please contact your Admin for an API URI"}
      FIFTYONE_APP_ALLOW_MEDIA_EXPORT: ${FIFTYONE_APP_ALLOW_MEDIA_EXPORT:-true}
      FIFTYONE_APP_TEAMS_SDK_RECOMMENDED_VERSION: 2.26.0
      FIFTYONE_AUTH_SECRET: ${FIFTYONE_AUTH_SECRET}
      FIFTYONE_TEAMS_PROXY_URL: ${FIFTYONE_TEAMS_PROXY_URL}
      FIFTYONE_TELEMETRY_REDIS_URL: ${FIFTYONE_TELEMETRY_REDIS_URL:-redis://telemetry-redis:6379}
      NODE_ENV: production
      RECOIL_DUPLICATE_ATOM_KEY_CHECKING_ENABLED: false
      FIFTYONE_APP_ANONYMOUS_ANALYTICS_ENABLED: ${FIFTYONE_APP_ANONYMOUS_ANALYTICS_ENABLED:-true}
      FIFTYONE_APP_DEPLOYMENT_CHARACTERISTICS: docker
      # If you are routing through a proxy server you will want to set
      #  HTTP_PROXY_URL, HTTPS_PROXY_URL, and NO_PROXY_LIST in your .env
      #  then add the following environment variables to your
      #  `compose.override.yaml`
      # GLOBAL_AGENT_HTTPS_PROXY: ${HTTPS_PROXY_URL}
      # GLOBAL_AGENT_HTTP_PROXY: ${HTTP_PROXY_URL}
      # GLOBAL_AGENT_NO_PROXY: ${NO_PROXY_LIST}
      # HTTPS_PROXY: ${HTTPS_PROXY_URL}
      # HTTP_PROXY: ${HTTP_PROXY_URL}
      # NO_PROXY: ${NO_PROXY_LIST}
      # ROARR_LOG: false
      # http_proxy: ${HTTP_PROXY_URL}
      # https_proxy: ${HTTPS_PROXY_URL}
      # no_proxy: ${NO_PROXY_LIST}
    ports:
      - ${APP_BIND_ADDRESS}:${APP_BIND_PORT}:3000
    restart: always

  teams-cas:
    image: voxel51/fiftyone-teams-cas:v2.26.0
    environment:
      CAS_DATABASE_NAME: ${CAS_DATABASE_NAME:-cas}
      CAS_DEFAULT_USER_ROLE: ${CAS_DEFAULT_USER_ROLE:-GUEST}
      CAS_MONGODB_URI: ${CAS_MONGO_DB_URI:-$FIFTYONE_DATABASE_URI}
      CAS_URL: ${BASE_URL}
      DEBUG: ${CAS_DEBUG:-cas:*,-cas:*:debug}
      FIFTYONE_AUTH_SECRET: ${FIFTYONE_AUTH_SECRET}
      LICENSE_KEY_FILE_PATHS: ${LICENSE_KEY_FILE_PATHS:-/opt/fiftyone/licenses/license}
      NEXTAUTH_URL: ${BASE_URL}/cas/api/auth
      TEAMS_API_DATABASE_NAME: ${FIFTYONE_DATABASE_NAME}
      TEAMS_API_MONGODB_URI: ${FIFTYONE_DATABASE_URI}
      FIFTYONE_ENCRYPTION_KEY: ${FIFTYONE_ENCRYPTION_KEY}
      # If you are routing through a proxy server you will want to set
      #  HTTP_PROXY_URL, HTTPS_PROXY_URL, and NO_PROXY_LIST in your .env
      #  then add the following environment variables to your
      #  `compose.override.yaml`
      # GLOBAL_AGENT_HTTPS_PROXY: ${HTTPS_PROXY_URL}
      # GLOBAL_AGENT_HTTP_PROXY: ${HTTP_PROXY_URL}
      # GLOBAL_AGENT_NO_PROXY: ${NO_PROXY_LIST}
      # HTTPS_PROXY: ${HTTPS_PROXY_URL}
      # HTTP_PROXY: ${HTTP_PROXY_URL}
      # NO_PROXY: ${NO_PROXY_LIST}
      # ROARR_LOG: false
      # http_proxy: ${HTTP_PROXY_URL}
      # https_proxy: ${HTTPS_PROXY_URL}
      # no_proxy: ${NO_PROXY_LIST}
    ports:
      - ${CAS_BIND_ADDRESS:-127.0.0.1}:${CAS_BIND_PORT:-3030}:3000
    restart: always
    volumes:
      - type: bind
        source: ${LOCAL_LICENSE_FILE_DIR}
        target: /opt/fiftyone/licenses
        read_only: true

  # Redis-backed queue (fiftyone.mq) for Activity Analytics events.
  # Emitting services enqueue here. The activity worker consumes.
  # The worker writes the activity_* collections in the FiftyOne database
  # and maintains the rollups behind the Audit Log and Jobs pages.
  # The queue is persisted with AOF onto the fiftyone-mq-redis-data volume,
  # so restarting the container replays queued jobs instead of losing them.
  # See docker/docs/configuring-activity-analytics.md.
  # Using an external Redis? Point FIFTYONE_MQ_REDIS_URL at it in .env and
  # remove this service in compose.override.yaml.
  fiftyone-mq-redis:
    image: redis:8
    # AOF (`--appendonly yes`) with `--appendfsync everysec` bounds queue
    # loss on a restart to roughly one second of writes.
    # RDB snapshots (what telemetry-redis uses) would lose up to a whole
    # snapshot interval, which is the wrong trade for a work queue.
    #
    # The queue requires `maxmemory-policy noeviction`.
    # An evicting policy (such as telemetry-redis's allkeys-lru) silently
    # drops queued jobs under memory pressure.
    # With noeviction, writes fail loudly and the best-effort emit path
    # degrades to dropped events.
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --dir
      - /data
      - --maxmemory
      - ${FIFTYONE_MQ_REDIS_MAXMEMORY:-200mb}
      - --maxmemory-policy
      - noeviction # required for queue durability
    restart: always
    volumes:
      - fiftyone-mq-redis-data:/data

  # One container runs the activity workers (ingest, rollup, prune) via the
  # combined entrypoint.
  # Keep this service at one replica.
  # The rollup and prune schedulers are single-flight.
  # See docker/docs/configuring-activity-analytics.md.
  activity-worker:
    # Published from the fiftyone-activity repo with each Enterprise release.
    # Keep the tag in lockstep with the other service images.
    image: voxel51/fiftyone-activity:v2.26.0
    command: ["fiftyone-activity-worker"]
    depends_on:
      - fiftyone-mq-redis
    environment:
      # The rollup worker emits derived events through the same
      # flag-gated path it consumes, so it reads the same gate.
      FIFTYONE_ACTIVITY_ENABLED: ${FIFTYONE_ACTIVITY_ENABLED:-true}
      FIFTYONE_MQ_REDIS_URL: ${FIFTYONE_MQ_REDIS_URL:-redis://fiftyone-mq-redis:6379/0}
      FIFTYONE_ACTIVITY_MONGO_URI: ${FIFTYONE_DATABASE_URI}
      # Co-locate the activity_* collections in the deployment's own
      # FiftyOne database rather than a fixed shared name.
      FIFTYONE_ACTIVITY_MONGO_DB: ${FIFTYONE_DATABASE_NAME}
      # The rollup worker's database watch reads the datasets database and
      # stamps FIFTYONE_ACTIVITY_ORG_ID onto the events it records.
      FIFTYONE_DATABASE_NAME: ${FIFTYONE_DATABASE_NAME}
      FIFTYONE_ACTIVITY_ORG_ID: ${FIFTYONE_ACTIVITY_ORG_ID}
      # Watches the datasets database's change stream for writes no service
      # reported. Needs a replica set; set false to opt out.
      FIFTYONE_ACTIVITY_WATCH_ENABLED: ${FIFTYONE_ACTIVITY_WATCH_ENABLED:-true}
      # Raw events are kept 365 days by default. Rollups are kept indefinitely.
      # The size cap (10 GiB default) prunes oldest-first.
      # Override both in .env.
      FIFTYONE_ACTIVITY_RETENTION_DAYS: ${FIFTYONE_ACTIVITY_RETENTION_DAYS:-365}
      FIFTYONE_ACTIVITY_MAX_STORAGE_BYTES: ${FIFTYONE_ACTIVITY_MAX_STORAGE_BYTES:-10737418240}
    restart: always

  telemetry-redis:
    image: ${TELEMETRY_REDIS_IMAGE:-redis:8-alpine}
    command:
      - redis-server
      - --save
      - "60"
      - "1"
      - --dir
      - /data
      - --maxmemory
      - ${TELEMETRY_REDIS_MAXMEMORY:-400mb}
      - --maxmemory-policy
      - allkeys-lru
    restart: always
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 512M
        reservations:
          cpus: "0.10"
          memory: 256M
    volumes:
      - telemetry-redis-data:/data

  # One sidecar per observed service. `pid: "service:<target>"` joins the
  # target's PID namespace so the sidecar can read /proc/<pid>/fd/1 and
  # psutil can see the target's process.
  fiftyone-app-telemetry:
    image: voxel51/telemetry-sidecar:v2.26.0
    pid: "service:fiftyone-app"
    # Matches the workload image's USER 1000:1000 so the kernel's
    # ptrace_may_access() check on /proc/<workload-pid>/fd/1 reads passes via the
    # same-UID fast path to allow for log tailing
    user: "1000:1000"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      POD_NAME: fiftyone-app
      POD_NAMESPACE: ${TELEMETRY_NAMESPACE:-docker}
      SERVICE_TYPE: fiftyone-app
      TARGET_NAME: ${FIFTYONE_APP_TARGET_NAME:-hypercorn}
      FIFTYONE_TELEMETRY_REDIS_URL: ${FIFTYONE_TELEMETRY_REDIS_URL:-redis://telemetry-redis:6379}
    deploy:
      resources:
        limits:
          cpus: "0.20"
          memory: 512M
        reservations:
          cpus: "0.20"
          memory: 512M
    restart: always
    depends_on:
      fiftyone-app:
        condition: service_started
        restart: true
      telemetry-redis:
        condition: service_started

  teams-api-telemetry:
    image: voxel51/telemetry-sidecar:v2.26.0
    pid: "service:teams-api"
    user: "1000:1000"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      POD_NAME: teams-api
      POD_NAMESPACE: ${TELEMETRY_NAMESPACE:-docker}
      SERVICE_TYPE: teams-api
      TARGET_NAME: ${TEAMS_API_TARGET_NAME:-fiftyone-teams-api}
      FIFTYONE_TELEMETRY_REDIS_URL: ${FIFTYONE_TELEMETRY_REDIS_URL:-redis://telemetry-redis:6379}
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: 512M
        reservations:
          cpus: "0.10"
          memory: 512M
    restart: always
    depends_on:
      teams-api:
        condition: service_started
        restart: true
      telemetry-redis:
        condition: service_started

volumes:
  fiftyone-mq-redis-data:
  telemetry-redis-data:
