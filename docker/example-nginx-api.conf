upstream teams-api {
  server localhost:8000;
}

# The enterprise agent gateway (MCP). Not started by common-services.yaml
# yet; point this at wherever you run the mcp-gateway container once it's
# available.
upstream mcp-gateway {
  server localhost:8001;
}

server {
  server_name your-api.server.name;

  proxy_busy_buffers_size   512k;
  proxy_buffers   4 512k;
  proxy_buffer_size   256k;

  # An MCP client (e.g. Claude Code) presents a bearer token, not a
  # session or API key, verified by the agent gateway itself. Carved out
  # ahead of the catch-all below, which would otherwise send it to
  # teams-api instead.
  location /mcp {
    proxy_pass http://mcp-gateway;
  }

  location / {
    # default is 1M; api needs higher for large mongo requests, file import
    client_max_body_size 100M;
    proxy_set_header Host $host;
    # if you are using a port other than 443 set:
    # proxy_set_header Host $host:$server_port;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_pass http://teams-api;
    # The API requires websockets
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";
  }

    listen 443 ssl;
    ssl_certificate /path/to/your/api/certificate.pem;
    ssl_certificate_key /path/to/your/api/key.pem;
    ssl_dhparam /path/to/your/api/dhparams.pem;
}

server {
    if ($host = your-api.server.name) {
        return 301 https://$host$request_uri;
    }

  listen 80;
  server_name your-api.server.name;
    return 404;
}
